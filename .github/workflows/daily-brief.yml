name: AI日报

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - name: 采集新闻
        run: |
          DATE=$(date +%Y-%m-%d)
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d 2>/dev/null || date -v-1d +%Y-%m-%d)
          mkdir -p 日报
          TOP_STORIES=$(curl -s --max-time 10 "https://hacker-news.firebaseio.com/v0/topstories.json" 2>/dev/null | head -c 500)
          > /tmp/news_raw.txt
          # 修复：topstories 被 head -c 500 硬截断，末尾常有不完整ID；grep过滤掉非纯数字，防止请求到 null
          for ID in $(echo "$TOP_STORIES" | tr ',' '\n' | tr -d '[] ' | grep -E '^[0-9]+$' | head -30); do
            ITEM=$(curl -s --max-time 5 "https://hacker-news.firebaseio.com/v0/item/${ID}.json" 2>/dev/null)
            # 修复：HN 对无效ID返回 null，json.load 得 None → None.get 崩溃；or {} 兜底，|| true 防止单条失败中止整步
            TITLE=$(echo "$ITEM" | python3 -c "import sys,json; d=json.load(sys.stdin) or {}; print(d.get('title',''))" 2>/dev/null || true)
            URL=$(echo "$ITEM" | python3 -c "import sys,json; d=json.load(sys.stdin) or {}; print(d.get('url',''))" 2>/dev/null || true)
            HN_URL="https://news.ycombinator.com/item?id=${ID}"
            # 只保留 YESTERDAY 当天及之后发布的新闻（用户要求：不要之前的旧闻）
            ITEM_TIME=$(echo "$ITEM" | python3 -c "import sys,json; d=json.load(sys.stdin) or {}; print(d.get('time',''))" 2>/dev/null || true)
            ITEM_DATE=$(TZ=Asia/Shanghai date -d "@${ITEM_TIME}" +%Y-%m-%d 2>/dev/null || echo "")
            if [ -n "$ITEM_DATE" ] && [[ "$ITEM_DATE" < "$YESTERDAY" ]]; then
              continue
            fi
            if echo "$TITLE" | grep -qiE 'ai |llm|gpt|claude|chatgpt|openai|model|machine.learning|deep.learning|neural|transformer|agent|anthropic|gemini|qwen|deepseek|copilot|coding|programming'; then
              echo "TITLE: ${TITLE}" >> /tmp/news_raw.txt
              [ -n "$URL" ] && [ "$URL" != "null" ] && echo "LINK: ${URL}" >> /tmp/news_raw.txt
              echo "HN: ${HN_URL}" >> /tmp/news_raw.txt
              echo "---" >> /tmp/news_raw.txt
            fi
          done
          echo "DATE=${DATE}" >> $GITHUB_ENV
          # ── memory 仓库的 git log（只取昨天北京时间的提交）──
          git log --after="${YESTERDAY}T00:00:00+08:00" --before="${YESTERDAY}T23:59:59+08:00" --format="%h %ad %s" --date=short --all > /tmp/git_log.txt
          # ── 游戏仓库的 git log（各自独立仓库，用 git clone 拉取）──
          for repo in chinese-chess gomoku draw-and-guess animal-battle screw-jam star-moon-temple; do
            echo "" >> /tmp/git_log.txt
            echo "=== $repo ===" >> /tmp/git_log.txt
            git clone --depth 5 "https://github.com/z15314102792-arch/$repo.git" "/tmp/repo_$repo" 2>/dev/null && \
              git -C "/tmp/repo_$repo" log --after="${YESTERDAY}T00:00:00+08:00" --before="${YESTERDAY}T23:59:59+08:00" --format="%h %ad %s" --date=short >> /tmp/git_log.txt 2>/dev/null || \
              echo "(无法获取)" >> /tmp/git_log.txt
          done
          GL=$(cat /tmp/git_log.txt)
          echo "GL<<EOF" >> $GITHUB_ENV
          echo "${GL}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          # ── 昨日总结日志（日记进度 + 会话快照 + 待办清单，日志板块的事实来源）──
          > /tmp/yesterday_logs.txt
          for f in "日记/${YESTERDAY}-进度.md" "session-${YESTERDAY}-progress.md" 待办/${YESTERDAY}-*.md; do
            if [ -f "$f" ]; then
              echo "===== ${f} =====" >> /tmp/yesterday_logs.txt
              cat "$f" >> /tmp/yesterday_logs.txt
              echo "" >> /tmp/yesterday_logs.txt
            fi
          done
          YL=$(cat /tmp/yesterday_logs.txt)
          echo "YL<<EOF_LOGS" >> $GITHUB_ENV
          echo "${YL}" >> $GITHUB_ENV
          echo "EOF_LOGS" >> $GITHUB_ENV

      - name: 健康检查
        run: |
          check_site() { curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$1" 2>/dev/null || echo "000"; }
          echo "CHESS_HTTP=$(check_site 'https://z15314102792-arch.github.io/chinese-chess/')" >> $GITHUB_ENV
          echo "GOMOKU_HTTP=$(check_site 'https://z15314102792-arch.github.io/gomoku/')" >> $GITHUB_ENV
          echo "DRAW_HTTP=$(check_site 'https://z15314102792-arch.github.io/draw-and-guess/')" >> $GITHUB_ENV
          echo "ANIMAL_HTTP=$(check_site 'https://z15314102792-arch.github.io/animal-battle/')" >> $GITHUB_ENV
          echo "SCREW_HTTP=$(check_site 'https://z15314102792-arch.github.io/screw-jam/')" >> $GITHUB_ENV
          echo "TEMPLE_HTTP=$(check_site 'https://z15314102792-arch.github.io/star-moon-temple/')" >> $GITHUB_ENV

      - name: 防重复检查
        id: dedup
        run: |
          if [ -f "日报/${DATE}-AI日报.md" ]; then
            echo "今日AI日报已存在，跳过"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: AI分析推送
        if: steps.dedup.outputs.skip != 'true'
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SCT_KEY: ${{ secrets.SERVER_CHAN_KEY }}
          CHESS_HTTP: ${{ env.CHESS_HTTP }}
          GOMOKU_HTTP: ${{ env.GOMOKU_HTTP }}
          DRAW_HTTP: ${{ env.DRAW_HTTP }}
          ANIMAL_HTTP: ${{ env.ANIMAL_HTTP }}
          SCREW_HTTP: ${{ env.SCREW_HTTP }}
          TEMPLE_HTTP: ${{ env.TEMPLE_HTTP }}
          YESTERDAY_LOGS: ${{ env.YL }}
          GIT_LOG: ${{ env.GL }}
        run: python3 scripts/daily_analyze.py

      - name: 保存并提交
        if: steps.dedup.outputs.skip != 'true'
        run: |
          echo "# AI日报 | ${DATE}" > "日报/${DATE}-AI日报.md"
          echo "" >> "日报/${DATE}-AI日报.md"
          cat /tmp/digest.md >> "日报/${DATE}-AI日报.md"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 日报/
          git diff --staged --quiet || git commit -m "AI日报 $(date +%Y-%m-%d)"
          git push
