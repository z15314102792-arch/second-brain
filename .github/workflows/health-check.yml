name: 项目健康巡检

on:
  schedule:
    # 北京时间 9:13 = UTC 1:13，每3天
    - cron: '13 1 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 健康检查
        run: |
          DATE=$(date +%Y-%m-%d)
          FILE="每日早报/健康巡检-${DATE}.md"
          mkdir -p 每日早报

          CHESS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://z15314102792-arch.github.io/chinese-chess/" 2>/dev/null || echo "000")
          GOMOKU=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://z15314102792-arch.github.io/gomoku/" 2>/dev/null || echo "000")
          TEMPLE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://z15314102792-arch.github.io/star-moon-temple/" 2>/dev/null || echo "000")

          CHESS_ICON="✅"; [ "$CHESS" != "200" ] && CHESS_ICON="❌"
          GOMOKU_ICON="✅"; [ "$GOMOKU" != "200" ] && GOMOKU_ICON="❌"
          TEMPLE_ICON="✅"; [ "$TEMPLE" != "200" ] && TEMPLE_ICON="❌"

          cat > "$FILE" << ENDOFFILE
          # 项目健康巡检 | ${DATE}

          | 项目 | 状态 | HTTP |
          |------|------|------|
          | 🎮 中国象棋 | ${CHESS_ICON} | ${CHESS} |
          | 🎮 五子棋 | ${GOMOKU_ICON} | ${GOMOKU} |
          | 🏰 星月神殿 | ${TEMPLE_ICON} | ${TEMPLE} |

          > 🤖 由 GitHub Actions 云端执行，每 3 天一次，无需电脑开机
          ENDOFFILE

          echo "巡检完成"

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 每日早报/
          git diff --staged --quiet || git commit -m "健康巡检 $(date +%Y-%m-%d)"
          git push
