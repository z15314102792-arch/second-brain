name: 每日综合推送

on:
  schedule:
    - cron: '57 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 采集数据
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          SCT_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p 每日早报

          # ============================================
          # 1. AI 新闻采集（Hacker News）
          # ============================================
          echo "📡 采集 AI 新闻..."
          TOP_STORIES=$(curl -s --max-time 10 "https://hacker-news.firebaseio.com/v0/topstories.json" 2>/dev/null | head -c 500)
          NEWS_COUNT=0
          > /tmp/news_raw.txt

          for ID in $(echo "$TOP_STORIES" | tr ',' '\n' | tr -d '[] ' | head -30); do
            ITEM=$(curl -s --max-time 5 "https://hacker-news.firebaseio.com/v0/item/${ID}.json" 2>/dev/null)
            TITLE=$(echo "$ITEM" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('title',''))" 2>/dev/null)
            URL=$(echo "$ITEM" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('url',''))" 2>/dev/null)
            HN_URL="https://news.ycombinator.com/item?id=${ID}"
            if echo "$TITLE" | grep -qiE 'ai |llm|gpt|claude|chatgpt|openai|model|machine.learning|deep.learning|neural|transformer|agent|anthropic|gemini|qwen|deepseek|copilot|coding|programming'; then
              NEWS_COUNT=$((NEWS_COUNT + 1))
              echo "TITLE: ${TITLE}" >> /tmp/news_raw.txt
              [ -n "$URL" ] && [ "$URL" != "null" ] && echo "LINK: ${URL}" >> /tmp/news_raw.txt
              echo "HN: ${HN_URL}" >> /tmp/news_raw.txt
              echo "---" >> /tmp/news_raw.txt
            fi
            [ $NEWS_COUNT -ge 10 ] && break
          done
          echo "新闻: ${NEWS_COUNT} 条"

          # ============================================
          # 2. 项目健康检查
          # ============================================
          echo "🩺 检查项目..."

          check_site() { curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$1" 2>/dev/null || echo "000"; }
          check_commit() {
            curl -s --max-time 10 "https://api.github.com/repos/z15314102792-arch/$1/commits/main" 2>/dev/null | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  date=d['commit']['committer']['date'][:10]
  msg=d['commit']['message'].split(chr(10))[0][:60]
  print(f'{date} | {msg}')
except: print('unknown')
"
          }

          CHESS_HTTP=$(check_site "https://z15314102792-arch.github.io/chinese-chess/")
          CHESS_CI=$(check_commit "chinese-chess")
          GOMOKU_HTTP=$(check_site "https://z15314102792-arch.github.io/gomoku/")
          GOMOKU_CI=$(check_commit "gomoku")
          DRAW_HTTP=$(check_site "https://z15314102792-arch.github.io/draw-and-guess/")
          DRAW_CI=$(check_commit "draw-and-guess")
          TEMPLE_HTTP=$(check_site "https://z15314102792-arch.github.io/star-moon-temple/")
          TEMPLE_CI=$(check_commit "star-moon-temple")

          OK_COUNT=0
          [ "$CHESS_HTTP" = "200" ] && OK_COUNT=$((OK_COUNT + 1))
          [ "$GOMOKU_HTTP" = "200" ] && OK_COUNT=$((OK_COUNT + 1))
          [ "$DRAW_HTTP" = "200" ] && OK_COUNT=$((OK_COUNT + 1))
          [ "$TEMPLE_HTTP" = "200" ] && OK_COUNT=$((OK_COUNT + 1))
          echo "健康: ${OK_COUNT}/4"

          # ============================================
          # 3. DeepSeek 综合生成
          # ============================================
          echo "🤖 DeepSeek 综合分析..."

          python3 << 'PYEOF'
import urllib.request, urllib.parse, json, os

news_raw = ""
try:
    with open('/tmp/news_raw.txt', 'r') as f:
        news_raw = f.read()
except:
    pass

prompt = f"""你是我的私人AI管家。每天早上帮我整理一份每日综合速报,推送到微信。

## 回复格式(严格按结构)

### 🗞️ AI 动态
从今天的Hacker News中选出最重要的3-5条AI相关新闻,每条格式:
> **[中文标题](链接)**
> 一句话大白话解释 + 💡 跟你有啥关系

注意:
- 中文标题用Markdown链接语法,指向原文。有LINK就用LINK,否则用HN讨论链接
- 每条标题都做成可点击的链接,让用户点标题就能跳转原文
- 每条都要解释+关系,不能只有标题

### 🩺 项目状态
四个项目各一行:
- ✅/⚠️ 项目名 — 状态简述 | 最后提交: 简述
- 星月神殿标注已放弃,不用给修复建议
- 健康用✅,异常用⚠️

### 📌 一句话
最后给一句总结或提醒。一切正常就说一切安好放心搬砖之类。有异常就提醒关注。

## 规则
- 总长控制在微信一条消息能看完
- 说人话,不要技术术语
- 用emoji让阅读轻松
- 每条新闻标题必须是可点击的Markdown链接: [标题](url)

## 数据

AI新闻原始数据:
{news_raw if news_raw.strip() else "今日无AI相关新闻"}

项目状态:
- 中国象棋: HTTP {os.environ['CHESS_HTTP']} | 最后提交 {os.environ['CHESS_CI']}
- 五子棋: HTTP {os.environ['GOMOKU_HTTP']} | 最后提交 {os.environ['GOMOKU_CI']}
- 你画我猜: HTTP {os.environ['DRAW_HTTP']} | 最后提交 {os.environ['DRAW_CI']}
- 星月神殿(已放弃): HTTP {os.environ['TEMPLE_HTTP']} | 最后提交 {os.environ['TEMPLE_CI']}

日期: {os.environ['DATE']} | 健康 {os.environ['OK_COUNT']}/4 | 新闻 {os.environ['NEWS_COUNT']}条"""

body = json.dumps({
    'model': 'deepseek-chat',
    'messages': [{'role': 'user', 'content': prompt}],
    'temperature': 0.7,
    'max_tokens': 3000
}, ensure_ascii=False).encode('utf-8')

req = urllib.request.Request(
    'https://api.deepseek.com/v1/chat/completions',
    data=body,
    headers={
        'Content-Type': 'application/json; charset=utf-8',
        'Authorization': 'Bearer ' + os.environ['DEEPSEEK_KEY']
    }
)
resp = json.loads(urllib.request.urlopen(req, timeout=90).read())
digest = resp['choices'][0]['message']['content']
tokens = resp['usage']['total_tokens']
print(f"DeepSeek: {tokens} tokens")

with open('/tmp/digest.md', 'w', encoding='utf-8') as f:
    f.write(digest)

# ============================================
# 4. 微信推送(单条消息)
# ============================================
preview = digest[:1500]
data = urllib.parse.urlencode({
    'title': f"每日速报 | {os.environ['DATE']} · {os.environ['OK_COUNT']}/4 · {os.environ['NEWS_COUNT']}条",
    'desp': preview
}).encode('utf-8')

r = urllib.request.urlopen(urllib.request.Request(
    f"https://sctapi.ftqq.com/{os.environ['SCT_KEY']}.send",
    data=data,
    headers={'Content-Type': 'application/x-www-form-urlencoded'}
))
print(f"微信推送: {r.read().decode()[:100]}")
PYEOF

          # ============================================
          # 5. 写文件
          # ============================================
          cat > "每日早报/${DATE}-综合早报.md" << 'FILEEOF'
          # 每日综合速报 | ${DATE}

          > 🤖 云端采集 + DeepSeek AI 分析 | 无需电脑开机

          ---

          $(cat /tmp/digest.md)

          ---

          > 由 GitHub Actions + DeepSeek 云端生成 | 每天 8:57 北京时间
          FILEEOF

          echo "DATE=${DATE}" >> $GITHUB_ENV
          echo "NEWS_COUNT=${NEWS_COUNT}" >> $GITHUB_ENV
          echo "OK_COUNT=${OK_COUNT}" >> $GITHUB_ENV
          echo ""
          echo "========== 全部完成 =========="
          echo "日期: ${DATE}"
          echo "新闻: ${NEWS_COUNT} 条"
          echo "健康: ${OK_COUNT}/4"
          echo "=============================="

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 每日早报/
          git diff --staged --quiet || git commit -m "每日综合速报 $(date +%Y-%m-%d)"
          git push
