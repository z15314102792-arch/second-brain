<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日速报 · 仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
.header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 24px 16px 0; text-align: center; border-bottom: 1px solid #2a2a4a; }
.header h1 { font-size: 22px; margin-bottom: 4px; }
.header p { font-size: 12px; color: #888; margin-bottom: 16px; }

/* 标签栏 */
.tabs { display: flex; gap: 0; max-width: 600px; margin: 0 auto; }
.tab-btn { flex: 1; padding: 12px 8px; background: none; border: none; color: #888; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; font-family: inherit; }
.tab-btn:hover { color: #ccc; }
.tab-btn.active { color: #64b5f6; border-bottom-color: #64b5f6; }

/* 内容区 */
.content { max-width: 700px; margin: 0 auto; padding: 20px 16px; display: none; }
.content.active { display: block; }

/* Markdown 渲染样式 */
.markdown-body { line-height: 1.7; }
.markdown-body h1 { font-size: 20px; margin: 16px 0 8px; color: #fff; }
.markdown-body h2 { font-size: 18px; margin: 16px 0 8px; color: #e0e0e0; border-bottom: 1px solid #2a2a3a; padding-bottom: 4px; }
.markdown-body h3 { font-size: 16px; margin: 12px 0 6px; color: #64b5f6; }
.markdown-body p { margin: 8px 0; }
.markdown-body a { color: #64b5f6; text-decoration: none; }
.markdown-body a:hover { text-decoration: underline; }
.markdown-body ul, .markdown-body ol { padding-left: 20px; margin: 8px 0; }
.markdown-body li { margin: 4px 0; }
.markdown-body blockquote { border-left: 3px solid #64b5f6; padding: 4px 12px; margin: 8px 0; color: #aaa; background: rgba(100,181,246,0.05); border-radius: 0 4px 4px 0; }
.markdown-body hr { border: none; border-top: 1px solid #2a2a3a; margin: 16px 0; }
.markdown-body code { background: #1a1a2e; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
.markdown-body strong { color: #fff; }
.markdown-body table { border-collapse: collapse; width: 100%; margin: 8px 0; }
.markdown-body th, .markdown-body td { border: 1px solid #2a2a3a; padding: 8px; text-align: left; }
.markdown-body th { background: #1a1a2e; }
.markdown-body img { max-width: 100%; }

/* 加载和空状态 */
.loading { text-align: center; padding: 60px 20px; color: #888; }
.spinner { width: 32px; height: 32px; border: 3px solid #2a2a3a; border-top-color: #64b5f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 60px 20px; color: #888; }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.error { text-align: center; padding: 60px 20px; color: #ef5350; }

/* 往期列表 */
.archive-list { list-style: none; }
.archive-item { display: flex; align-items: center; padding: 14px 12px; border-bottom: 1px solid #1a1a2e; cursor: pointer; transition: background 0.2s; }
.archive-item:hover { background: rgba(100,181,246,0.05); }
.archive-item .date { font-size: 14px; color: #ccc; flex: 1; }
.archive-item .arrow { color: #888; font-size: 12px; }

/* 关于页 */
.about-card { background: #1a1a2e; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
.about-card h3 { color: #64b5f6; margin-bottom: 12px; }
.about-card p { color: #aaa; font-size: 14px; line-height: 1.6; margin: 8px 0; }
.about-card .label { color: #888; font-size: 12px; }
</style>
</head>
<body>

<div class="header">
  <h1>📋 每日速报</h1>
  <p>云端采集 · AI 分析 · 自动推送</p>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('today')">📰 今日</button>
    <button class="tab-btn" onclick="switchTab('archive')">📚 往期</button>
    <button class="tab-btn" onclick="switchTab('about')">ℹ️ 关于</button>
  </div>
</div>

<div id="tab-today" class="content active">
  <div class="loading"><div class="spinner"></div><p>加载今日速报...</p></div>
</div>

<div id="tab-archive" class="content">
  <div class="loading"><div class="spinner"></div><p>加载往期列表...</p></div>
</div>

<div id="tab-about" class="content">
  <div class="about-card">
    <h3>🤖 这是什么</h3>
    <p>每天早上 8:57（北京时间），GitHub Actions 自动采集 AI 新闻并检查项目健康状态，由 DeepSeek AI 分析生成报告，推送到微信。</p>
    <p>完全免费，无需电脑开机，全云端运行。</p>
  </div>
  <div class="about-card">
    <h3>📡 数据来源</h3>
    <p><span class="label">新闻：</span>Hacker News 热门 AI 相关话题<br>
    <span class="label">分析：</span>DeepSeek AI 模型<br>
    <span class="label">推送：</span>Server 酱（微信消息通道）<br>
    <span class="label">托管：</span>GitHub Actions + GitHub Pages</p>
  </div>
  <div class="about-card">
    <h3>🕐 更新频率</h3>
    <p>每天一次，北京时间早上 8:57</p>
  </div>
</div>

<script>
const REPO = 'z15314102792-arch/second-brain';
const BRANCH = 'master';

async function fetchFile(path) {
  const url = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${path}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.text();
}

async function listDir(dir) {
  const url = `https://api.github.com/repos/${REPO}/contents/${dir}?ref=${BRANCH}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

function renderMarkdown(md) {
  // 移除第一行标题（页面已有标题）
  const lines = md.split('\n');
  if (lines[0].startsWith('# ')) lines.shift();
  // 移除第二行空行
  if (lines[0] === '') lines.shift();
  const processed = lines.join('\n');

  // 配置marked
  marked.setOptions({ breaks: true, gfm: true });
  return marked.parse(processed);
}

async function loadToday() {
  const el = document.getElementById('tab-today');
  try {
    // 获取今天的日期
    const now = new Date();
    const dateStr = now.toISOString().split('T')[0];

    let md;
    try {
      md = await fetchFile(`每日早报/${dateStr}-综合早报.md`);
    } catch {
      // 如果今天还没生成，尝试加载最新的
      const files = await listDir('每日早报');
      const digests = files
        .filter(f => f.name.includes('综合早报'))
        .sort((a, b) => b.name.localeCompare(a.name));
      if (digests.length === 0) throw new Error('暂无报告');
      md = await fetchFile(digests[0].path);
    }

    el.innerHTML = `<div class="markdown-body">${renderMarkdown(md)}</div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><p>暂无今日速报</p><p style="font-size:12px;color:#666">每天早上 8:57 自动生成</p></div>`;
    console.error(e);
  }
}

async function loadArchive() {
  const el = document.getElementById('tab-archive');
  try {
    const files = await listDir('每日早报');
    const digests = files
      .filter(f => f.name.includes('综合早报'))
      .sort((a, b) => b.name.localeCompare(a.name));

    if (digests.length === 0) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><p>暂无往期报告</p></div>`;
      return;
    }

    let html = '<ul class="archive-list">';
    for (const f of digests) {
      const date = f.name.replace('-综合早报.md', '');
      html += `<li class="archive-item" onclick="loadArchiveItem('${f.path}', '${date}')">
        <span class="date">📋 ${date}</span>
        <span class="arrow">→</span>
      </li>`;
    }
    html += '</ul>';
    html += '<div id="archive-detail" style="margin-top:16px;"></div>';
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = `<div class="error"><p>加载失败: ${e.message}</p></div>`;
    console.error(e);
  }
}

async function loadArchiveItem(path, date) {
  const detail = document.getElementById('archive-detail');
  if (!detail) return;
  detail.innerHTML = '<div class="loading"><div class="spinner"></div><p>加载中...</p></div>';

  try {
    const md = await fetchFile(path);
    detail.innerHTML = `
      <div style="background:#1a1a2e;border-radius:12px;padding:20px;">
        <h3 style="color:#64b5f6;margin-bottom:16px;">📋 ${date}</h3>
        <div class="markdown-body">${renderMarkdown(md)}</div>
      </div>`;
  } catch (e) {
    detail.innerHTML = `<div class="error">加载失败: ${e.message}</div>`;
  }
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));

  document.querySelector(`[onclick="switchTab('${name}')"]`).classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');

  if (name === 'today') loadToday();
  else if (name === 'archive') loadArchive();
}

// 启动：加载今日
loadToday();
</script>
</body>
</html>
